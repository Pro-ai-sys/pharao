<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Pharao</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #060a14;
            color: white;
        }
        .kolommen {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .kolom-links {
            flex: 1.5;
            min-width: 280px;
            padding: 20px;
        }
        .kolom-rechts {
            flex: 4;
            min-width: 400px;
            padding: 20px;
        }
        .logo {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
        }
        .banner {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: auto;
        }
        .projecten {
            padding: 40px 20px;
        }
        .projecten h2 {
            margin-bottom: 20px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
        }
        .project-kaart {
            background-color: #101828;
            border: 1px solid #2a3a55;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
        }
        .project-kaart:hover {
            transform: translateY(-4px);
            border-color: #4a9eff;
        }
        .project-kaart img {
            max-width: 80px;
            height: auto;
            margin-bottom: 12px;
        }
        .project-kaart span {
            display: block;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .project-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 450px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="kolommen">
        <div class="kolom-links">
            <img src="logo.png" alt="Chronos Labs logo" class="logo">
        </div>
        <div class="kolom-rechts">
            <img src="chronos-banner.png" alt="Chronos Machine banner" class="banner">
        </div>
    </div>

    <div class="projecten">
        <h2>Projecten</h2>
        <div class="project-grid">
            <a href="#" class="project-kaart"><span>Project 1</span></a>
            <a href="#" class="project-kaart"><span>Project 2</span></a>
            <a href="#" class="project-kaart"><span>Project 3</span></a>
            <a href="#" class="project-kaart"><span>Project 4</span></a>
            <a href="#" class="project-kaart"><span>Project 5</span></a>
            <a href="#" class="project-kaart"><span>Project 6</span></a>
            <a href="#" class="project-kaart"><span>Project 7</span></a>
            <a href="#" class="project-kaart"><span>Project 8</span></a>
            <a href="#" class="project-kaart"><span>Project 9</span></a>
        </div>
    </div>
</body>
</html>
