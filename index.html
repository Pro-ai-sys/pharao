<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Pharao</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #060a14;
            color: white;
        }
        .kolommen {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .kolom-links {
            flex: 1.5;
            min-width: 280px;
            padding: 20px;
        }
        .kolom-rechts {
            flex: 4;
            min-width: 400px;
            padding: 20px;
        }
        .logo {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
        }
        .banner {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="kolommen">
        <div class="kolom-links">
            <img src="logo.png" alt="Chronos Labs logo" class="logo">
        </div>
        <div class="kolom-rechts">
            <img src="chronos-banner.png" alt="Chronos Machine banner" class="banner">
        </div>
    </div>
    <h1 style="padding: 0 20px;">Welkom bij Pharao</h1>
    <p style="padding: 0 20px;">Mijn eerste website, live via GitHub en Vercel.</p>
</body>
</html>
